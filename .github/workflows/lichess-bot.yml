name: Lichess bot — Stockfish 19

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: lichess-bot-stockfish19
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Check out this bot configuration
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download lichess-bot
        run: |
          git clone --depth 1 https://github.com/lichess-bot-devs/lichess-bot.git lichess-bot
          cp lichess-bot/config.yml.default lichess-bot/config.yml

      - name: Install lichess-bot dependencies
        working-directory: lichess-bot
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Build custom London and French opening book
        working-directory: lichess-bot
        run: |
          mkdir -p engines
          python - <<'PY'
          import chess
          import chess.pgn
          import chess.polyglot
          import struct
          from pathlib import Path

          source = Path("../openings/repertoire.pgn")
          target = Path("engines/repertoire.bin")
          records = []
          games = 0

          def encode_polyglot_move(move):
              promotion = {None: 0, chess.KNIGHT: 1, chess.BISHOP: 2,
                           chess.ROOK: 3, chess.QUEEN: 4}[move.promotion]
              return (
                  chess.square_file(move.to_square)
                  | (chess.square_rank(move.to_square) << 3)
                  | (chess.square_file(move.from_square) << 6)
                  | (chess.square_rank(move.from_square) << 9)
                  | (promotion << 12)
              )

          with source.open(encoding="utf-8") as pgn:
              while game := chess.pgn.read_game(pgn):
                  if game.errors:
                      raise SystemExit(f"Invalid PGN: {game.errors}")
                  games += 1
                  is_french = game.headers.get("Event") == "French Defense"
                  board = game.board()
                  for ply, move in enumerate(game.mainline_moves()):
                      if move not in board.legal_moves:
                          raise SystemExit(f"Illegal move in repertoire: {move} at {board.fen()}")
                      # Skip White's 1.e4 in the French line: the book must
                      # answer that move with Black's 1...e6, not prescribe 1.e4.
                      if not (is_french and ply == 0):
                          key = chess.polyglot.zobrist_hash(board)
                          records.append((key, encode_polyglot_move(move), 100, 0))
                      board.push(move)

          if games != 5 or len(records) < 50:
              raise SystemExit(f"Opening book build failed: games={games}, entries={len(records)}")

          # Polyglot books are sorted by their 64-bit Zobrist key and consist
          # of fixed 16-byte big-endian records: key, move, weight, learn.
          records.sort(key=lambda item: (item[0], item[1]))
          with target.open("wb") as book:
              for record in records:
                  book.write(struct.pack(">QHHI", *record))

          if not target.exists() or target.stat().st_size != 16 * len(records):
              raise SystemExit("Polyglot book file has an unexpected size")

          start = chess.Board()
          after_e4 = chess.Board()
          after_e4.push_san("e4")
          london_replies = ("d5", "e6", "Nf6", "g6")
          with chess.polyglot.open_reader(target) as reader:
              start_moves = {start.san(entry.move) for entry in reader.find_all(start)}
              french_moves = {after_e4.san(entry.move) for entry in reader.find_all(after_e4)}
              london_checks = {}
              for reply in london_replies:
                  position = chess.Board()
                  position.push_san("d4")
                  position.push_san(reply)
                  london_checks[reply] = {
                      position.san(entry.move) for entry in reader.find_all(position)
                  }
          if start_moves != {"d4"} or french_moves != {"e6"}:
              raise SystemExit(f"Unexpected repertoire: first_moves={start_moves}, replies_to_e4={french_moves}")
          bad_london = {reply: moves for reply, moves in london_checks.items() if moves != {"Bf4"}}
          if bad_london:
              raise SystemExit(f"London System is not enforced after these replies: {bad_london}")

          print(f"Built {target}: {len(records)} valid Polyglot entries ({target.stat().st_size} bytes).")
          print("Verified: White starts 1.d4 and plays 2.Bf4 against ...d5, ...e6, ...Nf6 and ...g6.")
          print("Verified: against 1.e4 Black replies 1...e6 (French Defense).")
          PY

      - name: Download Stockfish 19
        run: |
          mkdir -p lichess-bot/engines
          curl -fL --retry 3 \
            https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz \
            -o /tmp/stockfish19.tar.gz
          mkdir -p /tmp/stockfish19-extract
          tar -xzf /tmp/stockfish19.tar.gz -C /tmp/stockfish19-extract
          ENGINE_BIN="$(find /tmp/stockfish19-extract -type f -name 'stockfish*' -perm /111 | head -n 1)"
          if [ -z "$ENGINE_BIN" ]; then
            echo "Could not find the Stockfish executable in the official archive."
            find /tmp/stockfish19-extract -maxdepth 4 -type f
            exit 1
          fi
          chmod +x "$ENGINE_BIN"
          mv "$ENGINE_BIN" lichess-bot/engines/stockfish
          lichess-bot/engines/stockfish --version

      - name: Configure bot for fast replies and the chosen openings
        working-directory: lichess-bot
        env:
          LICHESS_BOT_TOKEN: ${{ secrets.LICHESS_BOT_TOKEN }}
        run: |
          if [ -z "$LICHESS_BOT_TOKEN" ]; then
            echo "Missing repository secret: LICHESS_BOT_TOKEN"
            exit 1
          fi
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          path = Path("config.yml")
          config = yaml.safe_load(path.read_text(encoding="utf-8"))
          if not isinstance(config, dict):
              raise SystemExit("Invalid config.yml: expected a YAML mapping")

          config["token"] = os.environ["LICHESS_BOT_TOKEN"]

          engine = config.setdefault("engine", {})
          if not isinstance(engine, dict):
              raise SystemExit("Invalid config.yml: engine must be a mapping")
          engine["name"] = "stockfish"
          engine["ponder"] = True
          engine["uci_options"]["Threads"] = 2
          engine["uci_options"]["Hash"] = 2048
          engine["uci_options"]["Move Overhead"] = 100
          engine["polyglot"] = {
              "enabled": True,
              "book": {"standard": ["engines/repertoire.bin"]},
              "min_weight": 1,
              "selection": "best_move",
              "max_depth": 12,
              "normalization": "none",
          }
          engine["online_moves"]["lichess_opening_explorer"]["enabled"] = False

          config["fake_think_time"] = False
          config["rate_limiting_delay"] = 0
          config["move_overhead"] = 100

          # Automatically challenge random Lichess bots while idle.
          matchmaking = config.setdefault("matchmaking", {})
          if not isinstance(matchmaking, dict):
              raise SystemExit("Invalid config.yml: matchmaking must be a mapping")
          matchmaking["allow_matchmaking"] = True
          matchmaking["allow_during_games"] = False
          matchmaking["challenge_variant"] = "standard"
          matchmaking["challenge_timeout"] = 30
          matchmaking["challenge_initial_time"] = [180]
          matchmaking["challenge_increment"] = [1]
          matchmaking["opponent_min_rating"] = 600
          matchmaking["opponent_max_rating"] = 4000
          matchmaking.pop("opponent_rating_difference", None)
          matchmaking["rating_preference"] = "none"
          matchmaking["challenge_mode"] = "rated"
          matchmaking["challenge_filter"] = "fine"

          # Validate the exact structure that lichess-bot expects before launch.
          if not isinstance(engine["polyglot"], dict) or not engine["polyglot"]["enabled"]:
              raise SystemExit("Polyglot book configuration is invalid")
          if engine["polyglot"]["book"]["standard"] != ["engines/repertoire.bin"]:
              raise SystemExit("The custom opening book path is not configured")

          path.write_text(
              yaml.safe_dump(config, sort_keys=False, allow_unicode=True),
              encoding="utf-8",
          )
          if matchmaking["allow_matchmaking"] is not True or matchmaking["challenge_variant"] != "standard":
              raise SystemExit("Automatic standard-chess bot matchmaking is not enabled")
          if matchmaking["opponent_min_rating"] != 600 or matchmaking["opponent_max_rating"] != 4000:
              raise SystemExit("Matchmaking must allow the full Lichess bot rating range")
          if "opponent_rating_difference" in matchmaking:
              raise SystemExit("Matchmaking must not restrict opponents by rating difference")
          print("Configuration validated: Stockfish 19, London/French book, and automatic rated 3+1 matchmaking against bots from 600 to 4000.")

          PY

      - name: Run bot for this six-hour cycle
        working-directory: lichess-bot
        run: |
          echo "Starting lichess-bot with official Stockfish 19."
          set +e
          timeout --signal=INT --kill-after=30s 20700s python lichess-bot.py --config config.yml
          status=$?
          set -e

          # A clean exit in a few seconds means the bot quit instead of staying online.
          if [ "$status" -eq 0 ]; then
            echo "ERROR: lichess-bot exited before the scheduled run window."
            exit 1
          elif [ "$status" -eq 124 ]; then
            echo "Scheduled run window completed (5h45m)."
          else
            echo "ERROR: lichess-bot stopped unexpectedly with exit code $status."
            exit "$status"
          fi
